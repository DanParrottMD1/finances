services:
  db:
    image: mariadb:11.4
    container_name: finance-mariadb
    restart: unless-stopped
    ports:
      - "0.0.0.0:3307:3306"
    environment:
      MARIADB_DATABASE: finance_dev
      MARIADB_USER: finance_owner
      MARIADB_PASSWORD_FILE: /run/secrets/finance_owner_password
      MARIADB_ROOT_PASSWORD_FILE: /run/secrets/root_password
    secrets:
      - root_password
      - finance_owner_password
    volumes:
      - finance_mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

secrets:
  root_password:
    file: ./secrets/root_password
  finance_owner_password:
    file: ./secrets/finance_owner_password

volumes:
  finance_mariadb_data:
